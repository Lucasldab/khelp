  ["h / l",                  "scroll left / right"],
  ["Space / Shift+Space",    "next / prev page"],
  ["J / K",                  "page down / up"],
  ["gg / G",                 "first / last page"],
  ["d / u",                  "half page down / up"],
  ["+ / -",                  "zoom in / out"],
  ["=",                      "fit width"],
  ["s",                      "fit page"],
  ["a",                      "toggle adjust mode"],
  ["r",                      "rotate"],
  ["f",                      "follow link"],
  ["F",                      "show link target"],
  ["/",                      "search forward"],
  ["?",                      "search backward"],
  ["n / N",                  "next / prev match"],
  ["m<letter> / '<letter>",  "set / jump bookmark"],
  ["Tab",                    "toggle index"],
  ["F5 / F11",               "presentation / fullscreen"],
