# km tool registry — add a new [[tool]] block to register one
# parser variants:
#   "hypr_bind"     — Hyprland keybinds.conf  (bind/binde/bindl/bindle/bindm)
#   "ncmpcpp"       — def_key "x"\n  action[\n  action2...]
#   "imv_ini"       — [binds] section, key = action
#   "aerc"          — [section]\n key = command
#   "kitty"         — map <key> <action>
#   "mpv_input"     — key cmd ...  (mpv input.conf)
#   "nvim_lua"      — vim.keymap.set("mode", "lhs", "rhs") in Lua source
#   "yazi_toml"     — [[mgr.{,prepend_,append_}keymap]] on/run/desc
#   "static"        — read static_binds inline
#
# Each tool lists its config path (for `gd` jump-to-config).

[[tool]]
name = "hyprland"
path = "~/.config/hypr/keybinds.conf"
parser = "hypr_bind"

[[tool]]
name = "rmpc"
path = "~/.config/rmpc/config.ron"
parser = "static"
section = "core"
static_binds = [
  ["q",                      "quit"],
  ["?",                      "show help"],
  [":",                      "command mode"],
  ["p",                      "play / pause"],
  ["s",                      "stop"],
  ["> / <",                  "next / prev track"],
  ["f / b",                  "seek fwd / back"],
  [". / ,",                  "volume up / down"],
  ["z / x / c / v",          "repeat / random / consume / single"],
  ["1..7",                   "Queue/Dirs/Artists/AlbumArtists/Albums/Playlists/Search"],
  ["Tab / S-Tab",            "next / prev tab"],
  ["j / k",                  "down / up"],
  ["gg / G",                 "top / bottom"],
  ["<C-u> / <C-d>",          "half page up / down"],
  ["/",                      "search"],
  ["n / N",                  "next / prev match"],
  ["a / A",                  "add / add all"],
  ["D",                      "delete from queue"],
  ["<Space>",                "select"],
  ["<CR>",                   "confirm"],
  ["<C-U>",                  "MPD rescan"],
]

[[tool]]
name = "imv"
path = "~/.config/imv/config"
parser = "imv_ini"

[[tool]]
name = "aerc"
path = "~/.config/aerc/binds.conf"
parser = "aerc"

[[tool]]
name = "kitty"
path = "~/.config/kitty/kitty.conf"
parser = "kitty"

[[tool]]
name = "reader"
path = "/home/projects/readingViewer/README.md"
parser = "static"
section = "core"
static_binds = [
  ["j / Down",       "scroll down"],
  ["k / Up",         "scroll up"],
  ["Shift+scroll",   "fast scroll"],
  ["Space",          "page down"],
  ["b",              "page up"],
  ["g",              "go to top"],
  ["End",            "go to bottom"],
  ["+ / =",          "zoom in"],
  ["-",              "zoom out"],
  ["0",              "reset zoom"],
  ["Ctrl+scroll",    "zoom"],
  ["f",              "fullscreen"],
  ["q / Esc",        "quit"],
]

[[tool]]
name = "tmux"
path = "~/.config/tmux/tmux.conf"
parser = "static"
section = "core"
static_binds = [
  ["prefix + v",              "copy mode"],
  ["prefix + y",              "copy to clipboard"],
  ["prefix + h/t/n/s",        "pane nav (HTNS)"],
  ["prefix + ./,",            "next/prev window"],
  ["prefix + ^",              "last window"],
  ["prefix + r",              "reload config"],
  ["prefix + D",              "open TODO.md"],
  ["prefix + R",              "rename session"],
  ["prefix + X",              "kill session"],
  ["prefix + S/L",            "save/restore session"],
  ["prefix + Ctrl-F",         "sessionizer"],
  ["prefix + Alt-H/T",        "slot 0/1"],
]

[[tool]]
name = "nvim"
path = "~/.config/nvim/lua/lucas/remap.lua"
parser = "nvim_lua"

[[tool]]
name = "nvim-motions"
path = "~/.config/nvim/lua/lucas/remap.lua"
parser = "static"
section = "builtin"
static_binds = [
  ["0",                     "start of line (column 0)"],
  ["^",                     "first non-blank of line"],
  ["$",                     "end of line"],
  ["g_",                    "last non-blank of line"],
  ["g0 / g^ / g$",          "screen-line start / first non-blank / end"],
  ["w / W",                 "next word / WORD start"],
  ["e / E",                 "next word / WORD end"],
  ["b / B",                 "prev word / WORD start"],
  ["ge / gE",               "prev word / WORD end"],
  ["gg / G",                "first / last line"],
  ["{n}G  /  :{n}",         "jump to line n"],
  ["H / M / L",             "top / middle / bottom of screen"],
  ["zt / zz / zb",          "scroll: cursor to top / center / bottom"],
  ["<C-d> / <C-u>",         "half page down / up"],
  ["<C-f> / <C-b>",         "full page fwd / back"],
  ["%",                     "match pair (){}[]"],
  ["* / #",                 "search word under cursor fwd / back"],
  ["f{c} / F{c}",           "find char fwd / back on line"],
  ["t{c} / T{c}",           "till char fwd / back on line"],
  ["; / ,",                 "repeat f/t fwd / back"],
  ["``  /  ''",             "back to last jump (exact / line)"],
  ["<C-o> / <C-i>",         "jump list back / forward"],
  ["m{a-z} / `{a-z}",       "set mark / jump to mark"],
  ["ciw / caw",             "change inner / a word"],
  ["ci\" / ca(",            "change inner quotes / a-paren"],
  ["dd / yy / cc",          "delete / yank / change line"],
  ["D / Y / C",             "delete / yank / change to EOL"],
  ["x / X",                 "delete char under / before cursor"],
  ["u / <C-r>",             "undo / redo"],
  ["p / P",                 "paste after / before"],
  ["\".p",                  "paste from register . (last insert)"],
  [":reg",                  "show registers"],
  ["q{a-z} / @{a-z}",       "record / replay macro"],
  ["<C-a> / <C-x>",         "increment / decrement number"],
  [">> / <<",               "indent / dedent line"],
  ["=ap",                   "auto-indent paragraph"],
  ["zf / zo / zc",          "fold create / open / close"],
]

