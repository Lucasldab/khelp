section = "tui-menu"
static_binds = [
  ["send",                   "fd+fzf picker → lssend"],
  ["inbox",                  "open ~/localsend in yazi"],
  ["status",                 "systemctl --user status localsend"],
  ["restart daemon",         "systemctl --user restart localsend"],
]
